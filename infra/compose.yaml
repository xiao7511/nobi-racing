name: nobi-racing-local
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: nobi_racing
      POSTGRES_USER: nobi_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique local POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nobi_local -d nobi_racing"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "yes"]
    # Reserved local service. No published port; ACL required before app access.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"
volumes:
  postgres_data:
