location = /racing { return 302 /racing/; }
location ^~ /racing/api/v1/ {
    proxy_pass http://127.0.0.1:5292/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
    access_log off;
}
location ^~ /racing/ {
    alias /opt/nobi-racing/current/web/;
    index index.html;
    try_files $uri $uri/ /racing/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=0, must-revalidate, no-transform" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    access_log off;
}
