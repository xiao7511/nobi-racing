name: nobi-racing-phase2
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: nobi_racing
      POSTGRES_USER: nobi_migrator
      POSTGRES_PASSWORD: ${PHASE2_DB_OWNER_PASSWORD:?Use scripts/local-phase2.ps1}
    ports:
      - "127.0.0.1:55473:5432"
    volumes:
      - phase2_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nobi_migrator -d nobi_racing"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--aclfile", "/run/nobi/users.acl"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - ../.cache/phase2/users.acl:/run/nobi/users.acl:ro
    restart: "no"
volumes:
  phase2_postgres:
