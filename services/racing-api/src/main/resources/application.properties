spring.application.name=nobi-racing-api
server.port=${PORT:5280}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55473/nobi_racing}
spring.datasource.username=${DB_USER:nobi_runtime}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=1500
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.flyway.enabled=${DB_MIGRATE:false}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.user=${MIGRATION_DB_USER:${DB_USER:nobi_runtime}}
spring.flyway.password=${MIGRATION_DB_PASSWORD:${DB_PASSWORD:}}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:56379}
spring.data.redis.username=${REDIS_USER:nobi}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
nobi.cache.enabled=${CACHE_ENABLED:false}
nobi.territory=${DATA_TERRITORY:LOCAL}
nobi.cursor-key=${CURSOR_KEY:}
nobi.api.limit=${API_RATE_LIMIT:120}
nobi.api.window-seconds=60
nobi.sync.limit=6
nobi.sync.window-seconds=60
nobi.sync.max-attempts=3
nobi.sync.delay-ms=100
nobi.demo.seed=false
nobi.sync.on-start=false
spring.jackson.deserialization.fail-on-unknown-properties=true
