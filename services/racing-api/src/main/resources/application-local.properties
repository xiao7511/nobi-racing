# Synthetic, loopback-only development. Never use this profile as production configuration.
spring.flyway.enabled=true
nobi.demo.seed=true
nobi.sync.on-start=true
nobi.cache.enabled=true
# Personal loopback RSS reader only. Do not carry this mode into public or business use.
nobi.latest-news.mode=${LATEST_NEWS_MODE:personal}

nobi.news.translation-enabled=${NEWS_TRANSLATION_ENABLED:true}

nobi.weekends.mode=${WEEKENDS_MODE:personal}
nobi.season-insights.mode=${SEASON_INSIGHTS_MODE:personal}
